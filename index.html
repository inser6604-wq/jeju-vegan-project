<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제주비건지도</title>
</head>
<body>

  <main id="container" class="page page-index"></main>

  <section class="home-hero section">
    <div class="inner">

      <div class="home-hero-content">

        <p class="home-hero-subtitle">
          제주에서 발견하는 더 건강하고 지속 가능한 라이프 스타일
        </p>

        <h2 class="home-hero-title">
          EAT<br> 
          VEGAN<br>
          IN JEJU
          </h2>

        <div class="home-hero-btn">
          <a href="#" class="btn btn-primary">
            비건 지도 보기
          </a>
        </div>

      </div>

      <div class="home-hero-slide">
        <!-- swiper 할 자리임 -->
      </div>

    </div>
  </section>

  <section class="home-pick section">
    <div class="inner">

      <div class="section-head">
      <h2 class="section-title">오늘의 비건 <span>PICK</span>
      </h2>
      
      <a href="#" class="btn btn-primary">
        VIEW MORE
      </a>
      </div>

    <div class="home-pick-content">
    <!-- 메인카드 -->
    <div class="home-pick-main">
      <div class="home-pick-main-img">
        <img src="img/vegan-pick-img01.png" alt="제주 흑보리 비건 플레이트"> 
      </div>
      <div class="home-pick-main-info">
        <h3 class="home-pick-main-title">제주 흑보리 비건 플레이트</h3>
        <p class="home-pick-main-desc">고소한 <span>제주 흑보리와</span>
          <span>신선한 채소</span>로 완성한 건강한 한끼</p>
          <p class="home-pick-main-place">
            Jeju Veggie's · 제주시내
          </p>
    </div>
  </section>

  <section class="home-course section">
    <div class="inner"></div>
  </section>

  <section class="home-map section">
    <div class="inner"></div>
  </section>

  <section class="home-together section">
    <div class="inner"></div>
  </section>

  <section class="home-join section">
    <div class="inner"></div>
  </section>

  <section class="home-subscribe section">
    <div class="inner"></div>
  </section>

</body>
</html>
